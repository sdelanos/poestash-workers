name: Refresh Gem Usage
on:
  # Stopped on 2026-11-19. poe.ninja closed its builds / profiles API to third
  # parties (https://poe.ninja/docs/api, "What is not allowed"): the version
  # moved out of index-state and the search sits behind a Cloudflare challenge
  # that answers 403 to any non-browser client. Every run from 2026-11-18
  # 12:15 UTC failed. The `repository_dispatch` trigger is gone, so the app's
  # dispatch no longer starts a run (GitHub answers 204 for an event type
  # nothing listens for), and `ninja_gem_usage` keeps its last snapshot
  # (2026-11-18 06:15 UTC). The job is off too (`if: false`), so not even a
  # run by hand reaches poe.ninja's builds API, which their docs forbid and
  # which risks getting the price workers blocked. Kept for a workaround from
  # a sanctioned source. See README "Gem usage is stopped".
  workflow_dispatch: {}

concurrency:
  group: gem-usage-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Off while poe.ninja's builds API is closed to third parties (see `on:`
    # above): even a run by hand would call it. Remove this line only once the
    # worker reads a sanctioned source.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The app call after the write (src/lib/revalidate-app.ts). The URL is
      # the switch, unset skips it: PoeStash 1.x has no revalidate route, so it
      # waits for 2.0's cut-over. A failed call warns, never fails the run.
      POESTASH_APP_URL: ${{ vars.POESTASH_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Discovers the leagues poe.ninja tracks builds for, reduces them to the
      # priced set (Standard + the challenge league and its HC variant), and
      # refreshes each. A missing/low-population snapshot on one league is
      # skipped inside the script; only a genuine poe.ninja outage fails.
      - name: Refresh gem usage (auto)
        run: npx tsx src/refresh-gem-usage.ts
