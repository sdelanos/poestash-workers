name: Refresh Ninja Prices (PoE 2)
on:
  # Every 30 minutes. PoE 2 has 13 categories per league and only one
  # currently-indexed league, so a full refresh is ~14 fetches and a
  # few hundred upserts. Completes in a few seconds. The cadence lives in
  # the `vercel.json` cron that fires this event; no `schedule:` fallback
  # (ADR 0063).
  #
  # Fired by /api/cron/dispatch-worker in sdelanos/poestash. The `types`
  # value is the contract: that route sends this exact event_type, and GitHub
  # answers 204 for an event type nothing listens for, so renaming one side
  # silently stops the runs (ADR 0063).
  repository_dispatch:
    types: [refresh-ninja-prices-poe2]
  # A manual run may lower the share of a type's listed rows an answer must
  # hold before it marks the rest delisted (src/lib/ninja-delisting.ts):
  # 0 is the one-off backfill (README "Delisted rows"). Empty keeps 0.5.
  workflow_dispatch:
    inputs:
      delist_min_ratio:
        description: "Delisting floor, 0 to 1 (empty: 0.5, 0: backfill)"
        required: false
        default: ""

concurrency:
  group: ninja-refresh-poe2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The app call after the write (src/lib/revalidate-app.ts). The URL is
      # the switch, unset skips it: PoeStash 1.x has no revalidate route, so it
      # waits for 2.0's cut-over. A failed call warns, never fails the run.
      POESTASH_APP_URL: ${{ vars.POESTASH_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NINJA_DELIST_MIN_RATIO: ${{ inputs.delist_min_ratio }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `auto` discovers every indexed PoE 2 league from poe.ninja's
      # index-state endpoint and refreshes each one in series. Zero-touch
      # across league rollovers (Standard, Hardcore, temp leagues, etc).
      - name: Refresh PoE 2 ninja prices (auto-discovery)
        run: npx tsx src/refresh-ninja-prices.ts auto poe2
