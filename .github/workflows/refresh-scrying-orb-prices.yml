name: Refresh Scrying Orb Prices
on:
  # Daily at 04:20 UTC — one poe.watch currency call per league, ~100
  # Scrying Orb variants upserted per league. The cadence lives in the
  # `vercel.json` cron that fires this event; no `schedule:` fallback
  # (ADR 0063). This was the one worker GitHub already delivered at 100%,
  # so it moves for uniformity rather than to fix anything.
  #
  # Fired by /api/cron/dispatch-worker in sdelanos/poestash. The `types`
  # value is the contract: that route sends this exact event_type, and GitHub
  # answers 204 for an event type nothing listens for, so renaming one side
  # silently stops the runs (ADR 0063).
  repository_dispatch:
    types: [refresh-scrying-orb-prices]
  workflow_dispatch: {}

concurrency:
  group: scrying-orb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The app call after the write (src/lib/revalidate-app.ts). The URL is
      # the switch, unset skips it: PoeStash 1.x has no revalidate route, so it
      # waits for 2.0's cut-over. A failed call warns, never fails the run.
      POESTASH_APP_URL: ${{ vars.POESTASH_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Discovers the priced set from poe.watch (Standard, Hardcore, the live
      # challenge league + its HC variant) and refreshes each. Follows league
      # rollovers with no workflow edit; a league poe.watch hasn't indexed is
      # skipped, and only a genuine poe.watch outage fails the run.
      - name: Refresh Scrying Orb prices (auto)
        run: npx tsx src/refresh-scrying-orb-prices.ts
