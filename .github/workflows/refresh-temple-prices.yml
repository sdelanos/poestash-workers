name: Refresh Temple Prices
on:
  # Every 6h at :30 — each run hits the PoE trade API twice per league
  # (1 search + 1 fetch) for the gem-room t3 pseudo stat. ~8 calls per run
  # across the 4 leagues, well under the 30/300s ceiling. The cadence lives
  # in the `vercel.json` cron that fires this event; no `schedule:` fallback
  # (ADR 0063).
  #
  # Fired by /api/cron/dispatch-worker in sdelanos/poestash. The `types`
  # value is the contract: that route sends this exact event_type, and GitHub
  # answers 204 for an event type nothing listens for, so renaming one side
  # silently stops the runs (ADR 0063).
  repository_dispatch:
    types: [refresh-temple-prices]
  workflow_dispatch: {}

concurrency:
  group: temple-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POE_CLIENT_ID: ${{ secrets.POE_CLIENT_ID }}
      # The app call after the write (src/lib/revalidate-app.ts). The URL is
      # the switch, unset skips it: PoeStash 1.x has no revalidate route, so it
      # waits for 2.0's cut-over. A failed call warns, never fails the run.
      POESTASH_APP_URL: ${{ vars.POESTASH_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prices every PoE 1 league the ninja worker currently tracks (read from
      # ninja_price_meta): Standard, Hardcore, the live challenge league + its
      # HC variant. Follows league rollovers with no workflow edit.
      - name: Refresh temple prices (auto)
        run: npx tsx src/refresh-temple-prices.ts
