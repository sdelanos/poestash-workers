name: Refresh Ninja Prices
on:
  # Every 30 minutes — each run fetches all poe.ninja categories and
  # batch-upserts ~40k rows, rewriting only the ones whose data changed. Completes in ~15 seconds. The cadence lives in
  # the `vercel.json` cron that fires this event, not here: there is no
  # `schedule:` fallback, because GitHub delivered a fraction of these under
  # global load while every run it did start succeeded (ADR 0063).
  #
  # Fired by /api/cron/dispatch-worker in sdelanos/poestash. The
  # `types` value is the contract: that route sends this exact event_type,
  # and GitHub answers 204 for an event type nothing listens for, so
  # renaming one side silently stops the runs.
  repository_dispatch:
    types: [refresh-ninja-prices]
  workflow_dispatch: {}

concurrency:
  group: ninja-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Auto-discovers the PoE 1 leagues poe.ninja currently prices
      # (Standard, Hardcore, the live challenge league + its HC variant) and
      # refreshes each. Follows league rollovers with no workflow edit.
      - name: Refresh ninja prices (auto)
        run: npx tsx src/refresh-ninja-prices.ts auto poe1
