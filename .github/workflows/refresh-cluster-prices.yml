name: Refresh Cluster Prices
on:
  # Every 6h — each run processes ~2,100 combos before timeout, so the
  # 330-minute cap below is the designed stop and `cancelled` is this
  # worker's success state, not a failure. 4 runs/day covers all ~5,365
  # combos with room to spare, which is exactly what GitHub's schedule was
  # not delivering. The cadence lives in the `vercel.json` cron that fires
  # this event; no `schedule:` fallback (ADR 0063).
  #
  # Fired by /api/cron/dispatch-worker in sdelanos/poestash. The `types`
  # value is the contract: that route sends this exact event_type, and GitHub
  # answers 204 for an event type nothing listens for, so renaming one side
  # silently stops the runs (ADR 0063).
  repository_dispatch:
    types: [refresh-cluster-prices]
  workflow_dispatch: {}

concurrency:
  group: cluster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POE_CLIENT_ID: ${{ secrets.POE_CLIENT_ID }}
      # The app call after the write (src/lib/revalidate-app.ts). The URL is
      # the switch, unset skips it: PoeStash 1.x has no revalidate route, so it
      # waits for 2.0's cut-over. A failed call warns, never fails the run.
      POESTASH_APP_URL: ${{ vars.POESTASH_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No league argument: the worker resolves the current challenge league at
      # run time and seeds its combo rows on first sight, so a rollover needs no
      # workflow edit. Pass a name only for an ad-hoc backfill.
      - name: Refresh cluster prices
        run: npm run refresh:clusters
